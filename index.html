<header><div><h1>HELLAS · Spillerudvikling U13</h1></div></header><main>
<section id="login"><h2>Log ind</h2><p class="hint">Brug din godkendte Hellas-e-mailadresse.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="din@email.dk"><button id="send" class="primary" style="margin-top:12px">Send engangskode</button><div id="otpArea" class="hidden"><label for="otp">Engangskode (8 cifre)</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}"><button id="verify" class="primary" style="margin-top:12px">Log ind</button></div><p id="loginStatus" class="status" aria-live="polite"></p></section>

  function render(){
  // Download is read-only: the workbook is populated from the logged-in user's Supabase session.
  async function loadExcelJS(){
    if(window.ExcelJS)return window.ExcelJS;
    await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Kunne ikke hente Excel-biblioteket. Kontrollér internetforbindelsen.'));document.head.appendChild(s)});
    if(!window.ExcelJS)throw new Error('Excel-biblioteket blev ikke indlæst.');return window.ExcelJS;
  }
  async function fetchAll(query){const {data,error}=await query;if(error)throw error;return data||[]}
  async function downloadExcel(){
    const btn=$('downloadExcel');btn.disabled=true;btn.textContent='Henter Excel…';
    try{
      if(!currentUser||!profile?.active||!round)throw new Error('Log ind og vælg en vurderingsrunde først.');
      const [ExcelJS,ps,coaches,shared,assessments]=await Promise.all([
        loadExcelJS(),
        fetchAll(sb.from('players').select('id,name,current_level,updated_at').eq('active',true)),
        fetchAll(sb.from('profiles').select('user_id,display_name,is_coach,active').eq('is_coach',true)),
        fetchAll(sb.from('shared_assessments').select('player_id,technique,tactics,physical,mental_social,strengths,development,assessment_updated_at,conversation_notes,conversation_completed,conversation_completed_at,conversation_completed_by').eq('round_id',round.id)),
        fetchAll(sb.from('coach_assessments').select('coach_id,player_id,technique,tactics,physical,mental_social,strengths,development').eq('round_id',round.id))
      ]);
      if(!ps.length||new Set(ps.map(p=>p.id)).size!==ps.length)throw new Error('Spillerlisten er tom eller indeholder dublerede ID’er.');
      const workbook=new ExcelJS.Workbook();
      const bytes=Uint8Array.from(atob(HELLAS_TEMPLATE),c=>c.charCodeAt(0));
      await workbook.xlsx.load(bytes.buffer);
      const roster=workbook.getWorksheet('Spillere');if(!roster)throw new Error('Fanen Spillere mangler.');
      const byId=new Map(ps.map(p=>[p.id,p]));const rowById=new Map();
      for(let r=2;r<=roster.rowCount;r++){
        const id=String(roster.getCell('D'+r).value||'').trim();if(!id)continue;
        if(!byId.has(id))continue; // Inaktive spillere udelades af eksporten.
        if(rowById.has(id))throw new Error('Dubleret spiller-ID i skabelonen: '+id);
        rowById.set(id,r);
      }
      if(rowById.size!==ps.length)throw new Error('Excel-skabelonen mangler '+(ps.length-rowById.size)+' aktive spillere. Nye spillere kræver en udvidet skabelon.');
      // Bevar de eksisterende 37 skabelonrækker og formler, men skjul inaktive spillere.
      for(let r=2;r<=roster.rowCount;r++){
        const id=String(roster.getCell('D'+r).value||'').trim();
        if(!id||byId.has(id))continue;
        roster.getCell(r,1).value=null;roster.getCell(r,2).value=null;roster.getCell(r,4).value=null;roster.getRow(r).hidden=true;
        for(const name of ['Jakob','Martin','Morten','Danni','Anders B','Anders C','Gennemsnit','Fælles vurdering']){
          const sh=workbook.getWorksheet(name);if(!sh)continue;
          for(let c=1;c<=12;c++)sh.getCell(r,c).value=null;
          sh.getRow(r).hidden=true;
        }
      }
      roster.state='veryHidden'; // Skjul den tekniske spillerliste i den downloadede Excel-fil.
      const coachSheets=['Jakob','Martin','Morten','Danni','Anders B','Anders C'];
      const coachId=new Map();
      for(const name of coachSheets){
        const matching=coaches.filter(c=>c.display_name?.trim().toLocaleLowerCase('da-DK')===name.toLocaleLowerCase('da-DK'));
        if(matching.length>1)throw new Error('Flere trænerprofiler matcher '+name+'.');
        coachId.set(name,matching[0]?.user_id||null);
      }
      const byCoach=new Map(assessments.map(a=>[a.coach_id+'|'+a.player_id,a]));
      const byShared=new Map(shared.map(a=>[a.player_id,a]));
      const scoreKeys=['technique','tactics','physical','mental_social'];
      const fillSports=(sheet,r,a)=>{
        scoreKeys.forEach((k,i)=>{sheet.getCell(r,3+i).value=a?.[k]??null});
        sheet.getCell(r,7).value=a?.strengths??'';
        sheet.getCell(r,8).value=a?.development??'';
      };
      for(const [id,r] of rowById){
        const player=byId.get(id);
        roster.getCell(r,1).value=player.name;roster.getCell(r,2).value=player.current_level;
        for(const name of coachSheets){
          const sh=workbook.getWorksheet(name);if(!sh)throw new Error('Trænerfanen '+name+' mangler.');
          sh.getCell(r,1).value=player.name;sh.getCell(r,2).value=player.current_level;
          fillSports(sh,r,byCoach.get(coachId.get(name)+'|'+id));
        }
        const avg=workbook.getWorksheet('Gennemsnit');
        avg.getCell(r,1).value=player.name;avg.getCell(r,2).value=player.current_level;
        // Beregn Gennemsnit direkte ud fra samme aktuelle trænerdata som Fælles vurdering.
        // ExcelJS genberegner ikke formler, og gamle cacheværdier kan derfor vise forkerte kommentarer.
        const sh=workbook.getWorksheet('Fælles vurdering');
        if(!sh)throw new Error('Fanen Fælles vurdering mangler.');
        sh.getCell(r,1).value=player.name;sh.getCell(r,2).value=player.current_level;
        const existingShared=byShared.get(id);
        // Start new shared assessments with the same per-criterion averages and
        // combined coach comments as Gennemsnit. These are plain editable values,
        // not formulas. Existing shared assessments always take precedence.
        const sourceAssessments=coachSheets.map(name=>({name,assessment:byCoach.get(coachId.get(name)+'|'+id)}));
        const initialShared={};
        scoreKeys.forEach(k=>{
          const values=sourceAssessments.map(x=>x.assessment?.[k]).filter(v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))).map(Number);
          initialShared[k]=values.length?values.reduce((sum,v)=>sum+v,0)/values.length:null;
        });
        for(const k of ['strengths','development']){
          initialShared[k]=sourceAssessments.filter(x=>String(x.assessment?.[k]??'').trim()).map(x=>x.name+': '+x.assessment[k]).join('\n');
        }
        // Brug samme komplette trænergrundlag i begge faner. Gennemsnit er ikke redigerbar som fælles beslutning.
        fillSports(avg,r,initialShared);
        const a={...(existingShared??initialShared)};
        // Include every coach's comment, even when a shared assessment already exists.
        // Keep existing shared text and append only coach comments not already present.
        if(existingShared){
          for(const k of ['strengths','development']){
            let combined=String(existingShared[k]??'').trim();
            for(const x of sourceAssessments){
              const comment=String(x.assessment?.[k]??'').trim();
              if(!comment)continue;
              if(!combined.includes(comment)){
                combined+=(combined?'\n':'')+x.name+': '+comment;
              }
            }
            a[k]=combined;
          }
        }
        fillSports(sh,r,a);
        // Excel genberegner ikke altid rækkehøjden ved åbning, selv når tekstombrydning er slået til.
        // Sæt derfor både tekstombrydning og en passende højde i selve den eksporterede fil.
        const showAllComments=(sheet)=>{
          const commentCols=[7,8];
          let neededLines=1;
          for(const col of commentCols){
            const cell=sheet.getCell(r,col);
            cell.alignment={...(cell.alignment||{}),wrapText:true,vertical:'top'};
            const content=String(cell.value??'');
            const colWidth=Number(sheet.getColumn(col).width)||45;
            // Brug lidt sikkerhedsmargin, da Excel's tegnbredde afhænger af skrifttypen.
            const charsPerLine=Math.max(12,Math.floor(colWidth*0.85));
            const lines=content.split(/\r?\n/).reduce((count,line)=>count+Math.max(1,Math.ceil(line.length/charsPerLine)),0);
            neededLines=Math.max(neededLines,lines);
          }
          const row=sheet.getRow(r);
          const minimum=Number(row.height)||20;
          row.height=Math.min(409,Math.max(minimum,neededLines*16+9));
        };
        showAllComments(avg);
        showAllComments(sh);
        sh.getCell(r,9).value=a?.conversation_notes??'';
        sh.getCell(r,10).value=a?.conversation_completed?'Ja':'Nej';
        sh.getCell(r,11).value=a?.conversation_completed_at?new Date(a.conversation_completed_at):null;
        sh.getCell(r,12).value=a?.conversation_completed_by?(memberNames[a.conversation_completed_by]||a.conversation_completed_by):'';
      }
      // Trænersammenligning er en analysefane, ikke en kilde til upload.
      // Dens formler læser fra de seks trænerfaner og den skjulte spillerliste.
      const comparison=workbook.getWorksheet('Trænersammenligning');
      if(!comparison)throw new Error('Fanen Trænersammenligning mangler i Excel-skabelonen.');
      // Spiller-valget skal pege på en aktiv spiller, også når den tidligere valgte er deaktiveret.
      const selectedName=String(comparison.getCell('B4').value||'');
      if(!ps.some(p=>p.name===selectedName))comparison.getCell('B4').value=ps[0].name;
      // Skjul deaktiverede spillere i sammenligningstabellen (fire kriterier pr. spiller).
      for(let r=2;r<=roster.rowCount;r++){

 let savePromise=null,saveError=null,changeVersion=0;
 function scheduleSave(playerId,a,target){

 async function persist(){
  if(savePromise)return savePromise;
  if(!dirty)return true;
  if(!round||round.status!=='open'||!currentUser||!saveTarget)return false;
  clearTimeout(saveTimer);saveTimer=null;
  const {playerId,target}=saveTarget;
  const arr=target==='shared'||target==='conversation'?sharedAssess:ownAssess;
  const a=arr.find(x=>x.player_id===playerId);
  if(!a)return false;
  const version=changeVersion;
  const snapshot=Object.fromEntries([...fields,'strengths','development'].map(k=>[k,a[k]??(fields.includes(k)?null:'')]));
  const conversationSnapshot={conversation_notes:a.conversation_notes||'',conversation_completed:!!a.conversation_completed};
  const el=$('saveStatus');if(el)el.textContent='Gemmer…';
  saveBusy=true;
  savePromise=(async()=>{
   try{
    let result;
    if(target==='conversation'){
     result=await sb.from('shared_assessments').update(conversationSnapshot)
      .eq('round_id',round.id).eq('player_id',playerId)
      .select('id,conversation_completed,conversation_completed_at,conversation_completed_by');
    }else if(target==='shared'){
     result=await sb.from('shared_assessments').update(snapshot)
      .eq('round_id',round.id).eq('player_id',playerId).select('id');
    }else{
     const lookup=await sb.from('coach_assessments').select('id')
      .eq('round_id',round.id).eq('player_id',playerId)
      .eq('coach_id',currentUser.id).maybeSingle();
     if(lookup.error)throw lookup.error;
     if(lookup.data?.id){
      result=await sb.from('coach_assessments').update(snapshot)
       .eq('id',lookup.data.id).eq('coach_id',currentUser.id).select('id');
     }else{
      result=await sb.from('coach_assessments').insert({...snapshot,round_id:round.id,player_id:playerId,coach_id:currentUser.id}).select('id');
     }
    }
    if(result.error)throw result.error;
    if(!result.data?.length)throw new Error('Databasen afviste ændringen.');
    if(target==='mine'){
     const check=await sb.from('coach_assessments')
      .select('technique,tactics,physical,mental_social,strengths,development')
      .eq('round_id',round.id).eq('player_id',playerId)
      .eq('coach_id',currentUser.id).maybeSingle();
     if(check.error)throw check.error;
     if(!check.data||[...fields,'strengths','development'].some(k=>check.data[k]!==snapshot[k]))
      throw new Error('Kontrol af gemningen mislykkedes. Prøv igen.');
     a._savedOnServer=true;
    }
    if(target==='conversation'&&result.data?.[0]){
     // Metadata må opdateres, men nyere indtastninger må ikke overskrives.
     const {id,conversation_completed_at,conversation_completed_by}=result.data[0];
     Object.assign(a,{conversation_completed_at,conversation_completed_by});
     const meta=$('conversation_meta');
     if(meta&&selected===playerId&&tab==='shared'&&changeVersion===version)
      meta.textContent=conversationSnapshot.conversation_completed?'Gennemført '+dateText(conversation_completed_at)+' af '+(memberNames[conversation_completed_by]||profile.display_name):'Samtalen afventer';
    }
    saveError=null;
    if(changeVersion===version){dirty=false;if(el)el.textContent='Gemt ✓';}
    else if(el)el.textContent='Nye ændringer afventer gemning…';
    return true;
   }catch(e){
    saveError=e;dirty=true;
    if(el){
     el.textContent='Kunne ikke gemme: '+(e.message||e)+' — prøv igen.';
     const retry=document.createElement('button');retry.textContent='Prøv at gemme igen';
     retry.onclick=()=>{saveError=null;persist()};el.append(' ',retry);

  }

 async function flushSave(){

  while(savePromise){await savePromise}
