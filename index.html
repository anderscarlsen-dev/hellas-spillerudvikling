<section id="login"><h2>Log ind</h2><p class="hint">Brug din godkendte Hellas-e-mailadresse.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="din@email.dk"><button id="send" class="primary" style="margin-top:12px">Send engangskode</button><div id="otpArea" class="hidden"><label for="otp">Engangskode (8 cifre)</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}"><button id="verify" class="primary" style="margin-top:12px">Log ind</button></div><p id="loginStatus" class="status" aria-live="polite"></p></section>

  async function loadExcelJS(){
    if(window.ExcelJS)return window.ExcelJS;
    await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Kunne ikke hente Excel-biblioteket. Kontrollér internetforbindelsen.'));document.head.appendChild(s)});
    if(!window.ExcelJS)throw new Error('Excel-biblioteket blev ikke indlæst.');return window.ExcelJS;
  }
  async function fetchAll(query){const {data,error}=await query;if(error)throw error;return data||[]}
  async function downloadExcel(){
    const btn=$('downloadExcel');btn.disabled=true;btn.textContent='Henter Excel…';
    try{
      if(!currentUser||!profile?.active||!round)throw new Error('Log ind og vælg en vurderingsrunde først.');
      const [ExcelJS,ps,coaches,shared,assessments]=await Promise.all([
        loadExcelJS(),
        fetchAll(sb.from('players').select('id,name,current_level,updated_at').eq('active',true)),
        fetchAll(sb.from('profiles').select('user_id,display_name,is_coach,active').eq('is_coach',true)),
        fetchAll(sb.from('shared_assessments').select('player_id,technique,tactics,physical,mental_social,strengths,development,assessment_updated_at,conversation_notes,conversation_completed,conversation_completed_at,conversation_completed_by').eq('round_id',round.id)),
        fetchAll(sb.from('coach_assessments').select('coach_id,player_id,technique,tactics,physical,mental_social,strengths,development').eq('round_id',round.id))
      ]);
      if(ps.length!==37||new Set(ps.map(p=>p.id)).size!==37)throw new Error('Forventede 37 aktive spillere. Download afbrudt for at undgå en ufuldstændig fil.');
      const workbook=new ExcelJS.Workbook();
      const bytes=Uint8Array.from(atob(HELLAS_TEMPLATE),c=>c.charCodeAt(0));
      await workbook.xlsx.load(bytes.buffer);
      const roster=workbook.getWorksheet('Spillere');if(!roster)throw new Error('Fanen Spillere mangler.');
      const byId=new Map(ps.map(p=>[p.id,p]));const rowById=new Map();
      for(let r=2;r<=roster.rowCount;r++){
        const id=String(roster.getCell('D'+r).value||'').trim();if(!id)continue;
        if(!byId.has(id))throw new Error('Ukendt spiller-ID i skabelonen, række '+r);
        if(rowById.has(id))throw new Error('Dubleret spiller-ID i skabelonen: '+id);
        rowById.set(id,r);
      }
      if(rowById.size!==37)throw new Error('Excel-skabelonen indeholder ikke præcis 37 matchede Supabase-ID’er.');
      const coachSheets=['Jakob','Martin','Morten','Danni','Anders B','Anders C'];
      const coachId=new Map();
      for(const name of coachSheets){
        const matching=coaches.filter(c=>c.display_name?.trim().toLocaleLowerCase('da-DK')===name.toLocaleLowerCase('da-DK'));
        if(matching.length>1)throw new Error('Flere trænerprofiler matcher '+name+'.');
        coachId.set(name,matching[0]?.user_id||null);
      }
      const byCoach=new Map(assessments.map(a=>[a.coach_id+'|'+a.player_id,a]));
      const byShared=new Map(shared.map(a=>[a.player_id,a]));
      const scoreKeys=['technique','tactics','physical','mental_social'];
      const fillSports=(sheet,r,a)=>{
        scoreKeys.forEach((k,i)=>{sheet.getCell(r,3+i).value=a?.[k]??null});
        sheet.getCell(r,7).value=a?.strengths??'';
        sheet.getCell(r,8).value=a?.development??'';
      };
      for(const [id,r] of rowById){
        const player=byId.get(id);
        roster.getCell(r,1).value=player.name;roster.getCell(r,2).value=player.current_level;
        for(const name of coachSheets){
          const sh=workbook.getWorksheet(name);if(!sh)throw new Error('Trænerfanen '+name+' mangler.');
          sh.getCell(r,1).value=player.name;sh.getCell(r,2).value=player.current_level;
          fillSports(sh,r,byCoach.get(coachId.get(name)+'|'+id));
        }
        const avg=workbook.getWorksheet('Gennemsnit');
        avg.getCell(r,1).value=player.name;avg.getCell(r,2).value=player.current_level;
        // Preserve the existing formulas in Gennemsnit.
        const sh=workbook.getWorksheet('Fælles vurdering');
        if(!sh)throw new Error('Fanen Fælles vurdering mangler.');
        sh.getCell(r,1).value=player.name;sh.getCell(r,2).value=player.current_level;
        const a=byShared.get(id);
        // Shared assessments reflect Supabase, not the template's default average formulas.
        fillSports(sh,r,a);
        sh.getCell(r,9).value=a?.conversation_notes??'';
        sh.getCell(r,10).value=a?.conversation_completed?'Ja':'Nej';
        sh.getCell(r,11).value=a?.conversation_completed_at?new Date(a.conversation_completed_at):null;
        sh.getCell(r,12).value=a?.conversation_completed_by?(memberNames[a.conversation_completed_by]||a.conversation_completed_by):'';
      }
      // Store read-only sync metadata for the later, separate Excel upload workflow.
      let meta=workbook.getWorksheet('_Hellas_sync');if(meta)throw new Error('Skabelonen har allerede synkroniseringsmetadata.');
      meta=workbook.addWorksheet('_Hellas_sync');
      meta.addRow(['round_id','player_id','assessment_updated_at','player_updated_at','current_level','technique','tactics','physical','mental_social','strengths','development']);
      for(const [id] of rowById){const p=byId.get(id),a=byShared.get(id);meta.addRow([round.id,id,a?.assessment_updated_at||'',p.updated_at||'',p.current_level,...scoreKeys.map(k=>a?.[k]??''),a?.strengths??'',a?.development??'']);}
      meta.state='veryHidden';
      // Link to the shared upload page, accessible from the Excel cover sheet.
      const cover=workbook.getWorksheet('START HER');
      if(!cover)throw new Error('Fanen START HER mangler.');
      cover.getCell('A22').value='UPLOAD EFTER TRÆNERMØDET';
      cover.getCell('A22').font={bold:true,size:13,color:{argb:'FFA50D2D'}};
      cover.getCell('A23').value={text:'Klik her for at uploade de fælles vurderinger til Hellas',hyperlink:'https://anderscarlsen-dev.github.io/hellas-spillerudvikling/upload.html',tooltip:'Åbn Hellas uploadside'};
      cover.getCell('A23').font={bold:true,underline:true,color:{argb:'FF0563C1'}};
      cover.getCell('A24').value='Kun de fælles vurderinger og holdindplaceringer overføres. Login og godkendelse kræves.';
      cover.getCell('A24').font={italic:true,color:{argb:'FF66717C'},size:10};
      const buffer=await workbook.xlsx.writeBuffer();
      const file=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(file);const link=document.createElement('a');link.href=url;link.download='Hellas_Spillerudvikling_'+round.title.replace(/[^a-zA-Z0-9æøåÆØÅ-]/g,'_')+'.xlsx';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
      btn.textContent='Excel downloadet ✓';
    }catch(e){alert('Excel kunne ikke downloades: '+(e?.message||e));btn.textContent='Download Excel';}
    finally{btn.disabled=false;setTimeout(()=>{if(btn.textContent==='Excel downloadet ✓')btn.textContent='Download Excel'},4000)}
  }
  $('downloadExcel').onclick=downloadExcel;

 else if(mine){const shared=false;const exists=sharedAssess.some(x=>x.player_id===p.id);c.innerHTML=back+(shared?`<p class="hint">${exists?'Fælles vurdering. Ændringer gemmes automatisk.':'Der er endnu ingen fælles vurdering. Opret den fra trænernes gennemsnit.'}</p>`:`<p class="hint">${editable?'Ændringer gemmes automatisk i Supabase.':'Vurderingsrunden er ikke åben for redigering.'}</p>`)+(shared&&!exists?'<div class="actions"><button class="primary" id="initShared">Opret fra gennemsnit</button></div>':'')+(shared&&!exists?'':labels.map((name,i)=>`<div class="field"><label>${esc(name)}</label><p class="criterion-help">${esc(descriptions[i])}</p><div class="score">${[1,2,3,4,5].map(n=>`<button type="button" data-field="${fields[i]}" data-score="${n}" class="${a[fields[i]]===n?'active':''}" ${editable?'':'disabled'} title="${scale[n-1]}">${n}</button>`).join('')}</div><div class="hint" id="hint-${fields[i]}">${a[fields[i]]?scale[a[fields[i]]-1]:'Ikke vurderet'}</div></div>`).join('')+`<label for="strengths">Spidskompetencer</label><textarea id="strengths" ${editable?'':'disabled'}>${esc(a.strengths||'')}</textarea><label for="development">Udviklingsområder</label><textarea id="development" ${editable?'':'disabled'}>${esc(a.development||'')}</textarea><p id="saveStatus" class="save-status" aria-live="polite"></p>`);
 if(shared&&!exists){$('initShared').onclick=()=>initializeShared(p.id)}else if(editable){c.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{a[b.dataset.field]=Number(b.dataset.score);c.querySelectorAll(`[data-field="${b.dataset.field}"]`).forEach(x=>x.classList.toggle('active',x===b));$('hint-'+b.dataset.field).textContent=scale[a[b.dataset.field]-1];scheduleSave(p.id,a,tab)});['strengths','development'].forEach(f=>$(f).addEventListener('input',()=>{a[f]=$(f).value;scheduleSave(p.id,a,tab)}))}}
   else{const exists=sharedAssess.some(x=>x.player_id===p.id);c.innerHTML=back+(exists?'<p class="hint">Den fælles sportslige vurdering fastlægges i Excel. Samtalen registreres her.</p>':'<p class="hint">Ingen fælles vurdering endnu.</p>')+(exists?meter(a)+commentBlock(a):round?.status==='open'&&profile?.is_coach?'<div class="actions"><button class="primary" id="initShared">Opret fra gennemsnit</button></div>':'')+conversationHtml(a,exists);if(!exists&&$('initShared'))$('initShared').onclick=()=>initializeShared(p.id);if(exists&&canEditConversation()){const notes=$('conversation_notes'),check=$('conversation_completed');notes.addEventListener('input',()=>{a.conversation_notes=notes.value;scheduleSave(p.id,a,'conversation')});check.addEventListener('change',()=>{a.conversation_completed=check.checked;scheduleSave(p.id,a,'conversation')})}}
 $('back').onclick=async()=>{if(!(await flushSave()))return;selected=null;render()}}
 async function openPlayer(id){selected=id;loadingDetail=tab==='average';render();if(tab==='average'){try{const a=await getAverage(id);if(selected!==id||tab!=='average')return;averageAssess=averageAssess.filter(x=>x.player_id!==id);averageAssess.push({...a,player_id:id})}catch(e){if(selected===id)$('content').insertAdjacentHTML('beforeend',`<p class="notice">${esc(e.message)}</p>`)}finally{if(selected===id&&tab==='average'){loadingDetail=false;render()}}}}
 async function refreshAverages(){if(!round)return;const target=tab;const results=await Promise.allSettled(players.map(p=>getAverage(p.id)));if(tab!==target||selected)return;averageAssess=results.map((r,i)=>r.status==='fulfilled'?{...r.value,player_id:players[i].id}:{player_id:players[i].id});if(results.some(r=>r.status==='rejected')){const e=results.find(r=>r.status==='rejected');$('content').insertAdjacentHTML('afterbegin',`<p class="notice">Nogle gennemsnit kunne ikke hentes: ${esc(e.reason?.message||'Ukendt fejl')}</p>`)}else renderAverageRows()}
 function renderAverageRows(){if(tab!=='average'||selected)return;document.querySelectorAll('#content tbody tr[data-id]').forEach(tr=>{const a=averageAssess.find(x=>x.player_id===tr.dataset.id)||{};fields.forEach((f,i)=>{const cell=tr.cells[i+1];if(cell)cell.textContent=a[f]??'–'})})}
 async function initializeShared(playerId){const btn=$('initShared');btn.disabled=true;btn.textContent='Opretter…';try{const {error}=await sb.rpc('hellas_initialize_shared',{p_round_id:round.id,p_player_id:playerId});if(error)throw error;await refreshShared();if(!sharedAssess.some(a=>a.player_id===playerId)){btn.textContent='Ingen individuelle vurderinger endnu';return}render()}catch(e){btn.disabled=false;btn.textContent='Prøv igen';alert('Kunne ikke oprette fælles vurdering: '+e.message)}}
 function scheduleSave(playerId,a,target){const arr=target==='shared'||target==='conversation'?sharedAssess:ownAssess;if(!arr.some(x=>x.player_id===playerId))arr.push(Object.assign({player_id:playerId},a));saveTarget={playerId,target};dirty=true;const el=$('saveStatus');if(el)el.textContent='Ændringer afventer gemning…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;persist()},650)}
 async function persist(){if(saveBusy||!dirty)return;if(!round||round.status!=='open'||!currentUser||!saveTarget)return;saveBusy=true;dirty=false;const {playerId,target}=saveTarget;const arr=target==='shared'||target==='conversation'?sharedAssess:ownAssess;const a=arr.find(x=>x.player_id===playerId);if(!a){saveBusy=false;return}const snapshot=Object.fromEntries([...fields,'strengths','development'].map(k=>[k,a[k]??(fields.includes(k)?null:'')]));const el=$('saveStatus');if(el)el.textContent='Gemmer…';try{let result;if(target==='conversation'){result=await sb.from('shared_assessments').update({conversation_notes:a.conversation_notes||'',conversation_completed:!!a.conversation_completed}) .eq('round_id',round.id).eq('player_id',playerId).select('id,conversation_completed,conversation_completed_at,conversation_completed_by');}else if(target==='shared'){result=await sb.from('shared_assessments').update(snapshot).eq('round_id',round.id).eq('player_id',playerId).select('id')}else{const lookup=await sb.from('coach_assessments').select('id').eq('round_id',round.id).eq('player_id',playerId).eq('coach_id',currentUser.id).maybeSingle();if(lookup.error)throw lookup.error;if(lookup.data?.id){result=await sb.from('coach_assessments').update(snapshot).eq('id',lookup.data.id).eq('coach_id',currentUser.id).select('id')}else{result=await sb.from('coach_assessments').insert({...snapshot,round_id:round.id,player_id:playerId,coach_id:currentUser.id}).select('id')}}if(result.error)throw result.error;if(!result.data?.length)throw new Error('Databasen afviste ændringen.');if(target==='conversation'&&result.data?.[0]){Object.assign(a,result.data[0]);const meta=$('conversation_meta');if(meta&&selected===playerId&&tab==='shared')meta.textContent=a.conversation_completed?'Gennemført '+dateText(a.conversation_completed_at)+' af '+(memberNames[a.conversation_completed_by]||profile.display_name):'Samtalen afventer'}if(el)el.textContent=dirty?'Nye ændringer afventer gemning…':'Gemt ✓'}catch(e){dirty=true;if(el){el.textContent='Kunne ikke gemme: '+(e.message||e)+' — prøv igen.';const retry=document.createElement('button');retry.textContent='Prøv at gemme igen';retry.onclick=()=>persist();el.append(' ',retry)}}finally{saveBusy=false;if(dirty&&!document.querySelector('#saveStatus button')){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;persist()},650)}}}
 async function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await persist()}if(saveBusy||dirty){alert('Vent, indtil vurderingen er gemt.');return false}return true}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=async()=>{if(!(await flushSave()))return;if(!profile.is_coach&&b.dataset.tab!=='shared')return;tab=b.dataset.tab;selected=null;if(tab==='shared'){try{await refreshShared()}catch(e){alert('Kunne ikke hente fælles vurderinger: '+e.message);return}}render()});
try{await load()}catch(e){showLogin();fail(e)}
</script></body></html>
